<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skater Profiles — SkateFlicks</title>
<meta name="description" content="Browse skater profiles and filmographies. Follow your favorite skater's career through video parts.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#14141f;--surface2:#1e1e2e;--text:#e8e8f0;--muted:#8888a0;--accent:#ff4d6d;--accent2:#c77dff}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

nav{display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid #1a1a2a}
nav a.brand{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
nav a.nav-link{color:var(--muted);font-size:.9rem}nav a.nav-link:hover{color:var(--text)}
nav a.nav-link.active{color:var(--accent)}

.hero{text-align:center;padding:2.5rem 1rem 1.5rem;background:linear-gradient(180deg,#1a0a2e 0%,var(--bg) 100%)}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--muted);font-size:1rem;margin-top:.4rem}

.controls{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;padding:1rem 1.5rem;max-width:700px;margin:0 auto}
.search{flex:1;min-width:200px;padding:.6rem 1rem;border-radius:8px;border:1px solid #333;background:var(--surface);color:var(--text);font-size:.95rem;outline:none}
.search:focus{border-color:var(--accent)}
.sort-select{padding:.5rem .75rem;border-radius:8px;border:1px solid #333;background:var(--surface);color:var(--text);font-size:.9rem;cursor:pointer}

.stats{text-align:center;padding:.5rem;color:var(--muted);font-size:.85rem}

.skater-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem;max-width:1000px;margin:1rem auto 2rem;padding:0 1.5rem}
.skater-card{background:var(--surface);border-radius:12px;padding:1.25rem;transition:.3s;cursor:pointer;border:1px solid transparent}
.skater-card:hover{border-color:var(--accent);box-shadow:0 8px 30px rgba(255,77,109,.12);transform:translateY(-3px)}
.skater-name{font-size:1.15rem;font-weight:700;margin-bottom:.25rem}
.skater-meta{font-size:.85rem;color:var(--muted);margin-bottom:.6rem}
.skater-films{display:flex;flex-wrap:wrap;gap:.3rem}
.film-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.1)}
.skater-genres{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.genre-tag{font-size:.7rem;padding:.15rem .45rem;border-radius:10px;background:var(--surface2);color:var(--accent2);border:1px solid #333}

/* Profile view */
.profile{display:none;max-width:800px;margin:0 auto;padding:1.5rem}
.profile.open{display:block}
.profile-back{color:var(--muted);font-size:.9rem;margin-bottom:1rem;display:inline-block;cursor:pointer}
.profile-back:hover{color:var(--text)}
.profile-header{margin-bottom:2rem}
.profile-header h2{font-size:2rem;font-weight:800;margin-bottom:.25rem}
.profile-stats{display:flex;gap:1.5rem;margin-top:.75rem;flex-wrap:wrap}
.stat{text-align:center;background:var(--surface);border-radius:10px;padding:.75rem 1.25rem;min-width:80px}
.stat-num{font-size:1.4rem;font-weight:800;color:var(--accent)}
.stat-label{font-size:.75rem;color:var(--muted);margin-top:.15rem}

.filmography{margin-top:1.5rem}
.filmography h3{font-size:1rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:1rem}
.film-entry{display:flex;align-items:stretch;gap:1rem;background:var(--surface);border-radius:10px;padding:1rem;margin-bottom:.75rem;cursor:pointer;border:1px solid transparent;transition:.2s}
.film-entry:hover{border-color:var(--accent2)}
.film-color{width:6px;border-radius:3px;flex-shrink:0}
.film-info{flex:1}
.film-title{font-weight:700;font-size:1rem}
.film-detail{font-size:.85rem;color:var(--muted);margin-top:.2rem}
.film-genres{display:flex;gap:.3rem;margin-top:.4rem;flex-wrap:wrap}
.film-stars{color:#ffd60a;font-size:.8rem;margin-top:.3rem}
.film-watch{display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap}
.watch-sm{padding:.25rem .6rem;border-radius:6px;background:var(--accent);color:#fff;font-size:.75rem;font-weight:600}
.watch-sm:hover{opacity:.85;text-decoration:none}

.collab-section{margin-top:2rem}
.collab-section h3{font-size:1rem;color:var(--accent2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.75rem}
.collab-grid{display:flex;flex-wrap:wrap;gap:.5rem}
.collab-chip{padding:.4rem .8rem;border-radius:16px;background:var(--surface);font-size:.85rem;border:1px solid #333;cursor:pointer;transition:.2s}
.collab-chip:hover{border-color:var(--accent);color:var(--accent)}
.collab-count{font-size:.75rem;color:var(--muted);margin-left:.3rem}

footer{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem;border-top:1px solid #1a1a2a}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="brand">🎬 SkateFlicks</a>
  <a href="index.html" class="nav-link">Films</a>
  <a href="skaters.html" class="nav-link active">Skaters</a>
</nav>

<div id="directory-view">
  <div class="hero">
    <h1>🛹 Skater Profiles</h1>
    <p>Follow your favorite skater's career through video parts</p>
  </div>

  <div class="controls">
    <input class="search" type="text" placeholder="Search skaters..." id="search">
    <select class="sort-select" id="sort">
      <option value="name">A-Z</option>
      <option value="films">Most Films</option>
      <option value="era-old">Earliest Era</option>
      <option value="era-new">Latest Era</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
  <div class="skater-grid" id="skater-grid"></div>
</div>

<div class="profile" id="profile-view">
  <div class="profile-back" onclick="showDirectory()">← All Skaters</div>
  <div id="profile-content"></div>
</div>

<footer>
  <p>🎬 SkateFlicks — Built by <a href="https://clawdiard.github.io/clawdia-homepage/">Clawdia</a></p>
  <p style="margin-top:.5rem">An <a href="https://openclaw.ai">OpenClaw</a> Project</p>
</footer>

<script>
let films=[];
let skaters=[];

async function init(){
  const r=await fetch('data/films.json');
  films=await r.json();
  buildSkaters();
  renderDirectory();
  // Check URL hash for direct skater link
  if(location.hash){
    const name=decodeURIComponent(location.hash.slice(1));
    const s=skaters.find(x=>x.name===name||slugify(x.name)===name);
    if(s)showProfile(s.name);
  }
}

function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}

function buildSkaters(){
  const map={};
  films.forEach(f=>{
    f.skaters.forEach(name=>{
      if(!map[name])map[name]={name,films:[],genres:new Set()};
      map[name].films.push(f);
      f.genre.forEach(g=>map[name].genres.add(g));
    });
  });
  skaters=Object.values(map);
  skaters.forEach(s=>{
    s.films.sort((a,b)=>a.year-b.year);
    s.firstYear=s.films[0].year;
    s.lastYear=s.films[s.films.length-1].year;
    s.genres=[...s.genres].sort();
  });
}

function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase();
  const sort=document.getElementById('sort').value;
  let f=skaters.filter(s=>!q||s.name.toLowerCase().includes(q));
  if(sort==='name')f.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='films')f.sort((a,b)=>b.films.length-a.films.length);
  else if(sort==='era-old')f.sort((a,b)=>a.firstYear-b.firstYear);
  else if(sort==='era-new')f.sort((a,b)=>b.lastYear-a.lastYear);
  return f;
}

function renderDirectory(){
  const filtered=getFiltered();
  document.getElementById('stats').textContent=`${filtered.length} skaters across ${films.length} films`;
  const grid=document.getElementById('skater-grid');
  grid.innerHTML=filtered.map(s=>`
    <div class="skater-card" onclick="showProfile('${s.name.replace(/'/g,"\\'")}')">
      <div class="skater-name">${s.name}</div>
      <div class="skater-meta">${s.films.length} film${s.films.length>1?'s':''} · ${s.firstYear}–${s.lastYear}</div>
      <div class="skater-films">${s.films.map(f=>`<span class="film-dot" style="background:${f.coverColor}" title="${f.title} (${f.year})"></span>`).join('')}</div>
      <div class="skater-genres">${s.genres.map(g=>`<span class="genre-tag">${g}</span>`).join('')}</div>
    </div>
  `).join('');
}

function showProfile(name){
  const s=skaters.find(x=>x.name===name);
  if(!s)return;
  location.hash=slugify(s.name);
  document.getElementById('directory-view').style.display='none';
  const pv=document.getElementById('profile-view');
  pv.classList.add('open');

  // Find frequent collaborators
  const collabs={};
  s.films.forEach(f=>{
    f.skaters.forEach(other=>{
      if(other===s.name)return;
      collabs[other]=(collabs[other]||0)+1;
    });
  });
  const topCollabs=Object.entries(collabs).sort((a,b)=>b[1]-a[1]).slice(0,12);

  const avgRating=(s.films.reduce((sum,f)=>sum+f.rating,0)/s.films.length).toFixed(1);
  const companies=[...new Set(s.films.map(f=>f.company))];

  document.getElementById('profile-content').innerHTML=`
    <div class="profile-header">
      <h2>${s.name}</h2>
      <div style="color:var(--muted);font-size:.9rem">${companies.join(' · ')}</div>
      <div class="profile-stats">
        <div class="stat"><div class="stat-num">${s.films.length}</div><div class="stat-label">Films</div></div>
        <div class="stat"><div class="stat-num">${s.lastYear-s.firstYear||'<1'}</div><div class="stat-label">Year Span</div></div>
        <div class="stat"><div class="stat-num">${avgRating}</div><div class="stat-label">Avg Rating</div></div>
        <div class="stat"><div class="stat-num">${s.genres.length}</div><div class="stat-label">Genres</div></div>
      </div>
      <div class="skater-genres" style="margin-top:.75rem">${s.genres.map(g=>`<span class="genre-tag">${g}</span>`).join('')}</div>
    </div>

    <div class="filmography">
      <h3>Filmography</h3>
      ${s.films.map(f=>`
        <a href="index.html#${f.id}" class="film-entry" style="text-decoration:none;color:inherit">
          <div class="film-color" style="background:${f.coverColor}"></div>
          <div class="film-info">
            <div class="film-title">${f.title}</div>
            <div class="film-detail">${f.year} · ${f.company} · Dir: ${f.director}</div>
            <div class="film-genres">${f.genre.map(g=>`<span class="genre-tag">${g}</span>`).join('')}</div>
            <div class="film-stars">${'★'.repeat(f.rating)}${'☆'.repeat(5-f.rating)}</div>
            <div class="film-watch">${f.watchLinks.map(l=>`<a class="watch-sm" href="${l.url}" target="_blank" onclick="event.stopPropagation()">${l.platform} →</a>`).join('')}</div>
          </div>
        </a>
      `).join('')}
    </div>

    ${topCollabs.length?`
    <div class="collab-section">
      <h3>Frequent Collaborators</h3>
      <div class="collab-grid">
        ${topCollabs.map(([name,count])=>`<span class="collab-chip" onclick="showProfile('${name.replace(/'/g,"\\'")}')">${name}<span class="collab-count">(${count})</span></span>`).join('')}
      </div>
    </div>`:''}
  `;
  window.scrollTo(0,0);
}

function showDirectory(){
  location.hash='';
  document.getElementById('profile-view').classList.remove('open');
  document.getElementById('directory-view').style.display='';
}

window.addEventListener('hashchange',()=>{
  if(!location.hash)showDirectory();
});

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('search').addEventListener('input',renderDirectory);
  document.getElementById('sort').addEventListener('change',renderDirectory);
});

init();
</script>
</body>
</html>
