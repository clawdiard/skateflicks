<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkateFlicks — The Skateboarding Film Encyclopedia</title>
<meta name="description" content="Explore the greatest skateboarding videos and films ever made. From Bones Brigade to modern classics.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#14141f;--surface2:#1e1e2e;--text:#e8e8f0;--muted:#8888a0;--accent:#ff4d6d;--accent2:#c77dff}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

.hero{text-align:center;padding:3rem 1rem 2rem;background:linear-gradient(180deg,#1a0a2e 0%,var(--bg) 100%)}
.hero h1{font-size:clamp(2rem,6vw,3.5rem);font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--muted);font-size:1.1rem;margin-top:.5rem;max-width:500px;margin-inline:auto}

.controls{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;padding:1rem 1.5rem;max-width:900px;margin:0 auto}
.search{flex:1;min-width:200px;padding:.6rem 1rem;border-radius:8px;border:1px solid #333;background:var(--surface);color:var(--text);font-size:.95rem;outline:none}
.search:focus{border-color:var(--accent)}
.filter-btn{padding:.5rem 1rem;border-radius:20px;border:1px solid #333;background:var(--surface);color:var(--muted);cursor:pointer;font-size:.85rem;transition:.2s}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--surface2)}
.sort-select{padding:.5rem .75rem;border-radius:8px;border:1px solid #333;background:var(--surface);color:var(--text);font-size:.9rem;cursor:pointer}

.stats{text-align:center;padding:.5rem;color:var(--muted);font-size:.85rem}

.timeline{position:relative;max-width:1000px;margin:1rem auto 3rem;padding:0 1.5rem}
.decade-label{color:var(--accent2);font-size:1.4rem;font-weight:700;padding:1.5rem 0 .75rem;border-bottom:2px solid #222}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;padding:1rem 0}
.card{background:var(--surface);border-radius:12px;overflow:hidden;transition:.3s;cursor:pointer;border:1px solid transparent}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 30px rgba(255,77,109,.15)}
.card-cover{height:8px;width:100%}
.card-body{padding:1rem 1.25rem 1.25rem}
.card-year{font-size:.8rem;color:var(--accent);font-weight:600}
.card-title{font-size:1.1rem;font-weight:700;margin:.25rem 0}
.card-company{font-size:.85rem;color:var(--muted);margin-bottom:.5rem}
.card-skaters{font-size:.8rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-genres{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.genre-tag{font-size:.7rem;padding:.2rem .5rem;border-radius:10px;background:var(--surface2);color:var(--accent2);border:1px solid #333}
.stars{color:#ffd60a;font-size:.85rem;margin-top:.4rem}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:16px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-cover{height:12px;width:100%;border-radius:16px 16px 0 0}
.modal-close{position:absolute;top:1rem;right:1rem;background:var(--surface2);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--accent);color:#fff}
.modal-body{padding:1.5rem 2rem 2rem}
.modal-body h2{font-size:1.5rem;margin-bottom:.25rem}
.modal-body .meta{color:var(--muted);margin-bottom:1rem}
.modal-body .desc{line-height:1.6;margin-bottom:1rem}
.modal-body .section-title{font-weight:700;color:var(--accent2);margin:1rem 0 .5rem;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em}
.skater-list{display:flex;flex-wrap:wrap;gap:.4rem}
.skater-chip{padding:.3rem .7rem;border-radius:16px;background:var(--surface2);font-size:.85rem;border:1px solid #333}
.watch-links{display:flex;gap:.5rem;flex-wrap:wrap}
.watch-btn{padding:.5rem 1rem;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;font-size:.85rem;transition:.2s}
.watch-btn:hover{opacity:.85;text-decoration:none}

.user-rating{display:flex;align-items:center;gap:.5rem;margin-top:.5rem}
.user-stars{display:inline-flex;gap:2px;cursor:pointer}
.user-stars .star{color:#444;font-size:1rem;transition:.15s;user-select:none}
.user-stars .star:hover,.user-stars .star.active{color:#ffd60a}
.user-stars .star.hovered{color:#ffd60a;opacity:.7}
.fav-btn{background:none;border:none;font-size:1.1rem;cursor:pointer;transition:.2s;padding:2px;line-height:1;filter:grayscale(1) opacity(.4)}
.fav-btn.active{filter:none}
.fav-btn:hover{filter:none;transform:scale(1.2)}
.card .fav-btn{position:absolute;top:.6rem;right:.6rem;font-size:1.2rem;z-index:2}
.card{position:relative}
.user-rating-label{font-size:.75rem;color:var(--muted)}
.avg-user-badge{font-size:.75rem;color:var(--accent2);margin-left:.25rem}

.favs-toggle{padding:.5rem 1rem;border-radius:20px;border:1px solid #333;background:var(--surface);color:var(--muted);cursor:pointer;font-size:.85rem;transition:.2s}
.favs-toggle:hover,.favs-toggle.active{border-color:#ff4d6d;color:#ff4d6d;background:var(--surface2)}

footer{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem;border-top:1px solid #1a1a2a}
</style>
</head>
<body>

<nav style="display:flex;align-items:center;gap:1rem;padding:1rem 1.5rem;border-bottom:1px solid #1a1a2a">
  <a href="index.html" style="font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none">🎬 SkateFlicks</a>
  <a href="index.html" style="color:var(--accent);font-size:.9rem;text-decoration:none">Films</a>
  <a href="skaters.html" style="color:var(--muted);font-size:.9rem;text-decoration:none">Skaters</a>
</nav>

<div class="hero">
  <h1>🎬 SkateFlicks</h1>
  <p>The definitive encyclopedia of skateboarding films & video parts</p>
</div>

<div class="controls">
  <input class="search" type="text" placeholder="Search films, skaters, companies..." id="search">
  <button class="favs-toggle" id="favs-toggle" onclick="toggleFavsFilter()">❤️ Favorites</button>
  <select class="sort-select" id="sort">
    <option value="year-desc">Newest First</option>
    <option value="year-asc">Oldest First</option>
    <option value="rating">Top Rated</option>
    <option value="user-rating">My Rating</option>
    <option value="alpha">A-Z</option>
  </select>
</div>
<div class="controls" id="genre-filters"></div>
<div class="stats" id="stats"></div>

<div class="timeline" id="timeline"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<footer>
  <p>🎬 SkateFlicks — Built by <a href="https://clawdiard.github.io/clawdia-homepage/">Clawdia</a></p>
  <p style="margin-top:.5rem">An <a href="https://openclaw.ai">OpenClaw</a> Project</p>
</footer>

<script>
let films=[];let activeGenres=new Set();let showFavsOnly=false;

// localStorage helpers
function getUserRatings(){try{return JSON.parse(localStorage.getItem('sf-ratings')||'{}');}catch(e){return {};}}
function setUserRating(id,val){const r=getUserRatings();if(val===0)delete r[id];else r[id]=val;localStorage.setItem('sf-ratings',JSON.stringify(r));}
function getUserRating(id){return getUserRatings()[id]||0;}
function getFavs(){try{return JSON.parse(localStorage.getItem('sf-favs')||'[]');}catch(e){return [];}}
function toggleFav(id){let f=getFavs();if(f.includes(id))f=f.filter(x=>x!==id);else f.push(id);localStorage.setItem('sf-favs',JSON.stringify(f));}
function isFav(id){return getFavs().includes(id);}

function toggleFavsFilter(){
  showFavsOnly=!showFavsOnly;
  document.getElementById('favs-toggle').classList.toggle('active',showFavsOnly);
  render();
}

function buildStarsHTML(filmId,context){
  const ur=getUserRating(filmId);
  let stars='';
  for(let i=1;i<=5;i++){
    stars+=`<span class="star ${i<=ur?'active':''}" data-film="${filmId}" data-val="${i}" data-ctx="${context}" onmouseenter="hoverStar(this)" onmouseleave="unhoverStar(this)" onclick="rateStar(event,this)">★</span>`;
  }
  return stars;
}

function hoverStar(el){
  const val=+el.dataset.val;
  const siblings=el.parentElement.querySelectorAll('.star');
  siblings.forEach(s=>{s.classList.toggle('hovered',+s.dataset.val<=val);});
}
function unhoverStar(el){
  el.parentElement.querySelectorAll('.star').forEach(s=>s.classList.remove('hovered'));
}
function rateStar(e,el){
  e.stopPropagation();
  const id=el.dataset.film;const val=+el.dataset.val;
  const cur=getUserRating(id);
  setUserRating(id,cur===val?0:val);// click same star to clear
  // re-render only stars in same context
  if(el.dataset.ctx==='modal'){
    document.querySelector('.modal .user-stars').innerHTML=buildStarsHTML(id,'modal');
    // also update card behind
    render();
  }else{
    render();
  }
}

function handleFavClick(e,id){
  e.stopPropagation();
  toggleFav(id);
  // if modal open, update it too
  const modalOverlay=document.getElementById('modal-overlay');
  if(modalOverlay.classList.contains('open')){
    const favBtn=document.querySelector('.modal .fav-btn');
    if(favBtn)favBtn.classList.toggle('active',isFav(id));
  }
  render();
}

async function init(){
  const r=await fetch('data/films.json');
  films=await r.json();
  buildGenreFilters();
  render();
}

function buildGenreFilters(){
  const genres=new Set();
  films.forEach(f=>f.genre.forEach(g=>genres.add(g)));
  const el=document.getElementById('genre-filters');
  [...genres].sort().forEach(g=>{
    const btn=document.createElement('button');
    btn.className='filter-btn';btn.textContent=g;
    btn.onclick=()=>{
      if(activeGenres.has(g)){activeGenres.delete(g);btn.classList.remove('active')}
      else{activeGenres.add(g);btn.classList.add('active')}
      render();
    };
    el.appendChild(btn);
  });
}

function getFiltered(){
  let q=document.getElementById('search').value.toLowerCase();
  let sort=document.getElementById('sort').value;
  let f=films.filter(film=>{
    if(showFavsOnly&&!isFav(film.id))return false;
    if(q&&!film.title.toLowerCase().includes(q)&&!film.company.toLowerCase().includes(q)&&!film.skaters.some(s=>s.toLowerCase().includes(q)))return false;
    if(activeGenres.size&&!film.genre.some(g=>activeGenres.has(g)))return false;
    return true;
  });
  if(sort==='year-desc')f.sort((a,b)=>b.year-a.year);
  else if(sort==='year-asc')f.sort((a,b)=>a.year-b.year);
  else if(sort==='rating')f.sort((a,b)=>b.rating-a.rating||b.year-a.year);
  else if(sort==='user-rating')f.sort((a,b)=>(getUserRating(b.id)||0)-(getUserRating(a.id)||0)||b.year-a.year);
  else f.sort((a,b)=>a.title.localeCompare(b.title));
  return f;
}

function render(){
  const filtered=getFiltered();
  const favCount=getFavs().length;
  document.getElementById('stats').textContent=`Showing ${filtered.length} of ${films.length} films`+(favCount?` · ${favCount} favorited`:'');
  const tl=document.getElementById('timeline');
  tl.innerHTML='';
  const decades={};
  filtered.forEach(f=>{const d=Math.floor(f.year/10)*10;if(!decades[d])decades[d]=[];decades[d].push(f)});
  const sortedDecades=Object.keys(decades).sort((a,b)=>b-a);
  sortedDecades.forEach(decade=>{
    const label=document.createElement('div');
    label.className='decade-label';label.textContent=decade+'s';
    tl.appendChild(label);
    const grid=document.createElement('div');grid.className='grid';
    decades[decade].forEach(film=>{
      const ur=getUserRating(film.id);
      const favActive=isFav(film.id)?'active':'';
      grid.innerHTML+=`<div class="card" onclick="openModal('${film.id}')">
        <button class="fav-btn ${favActive}" onclick="handleFavClick(event,'${film.id}')" title="Toggle favorite">❤️</button>
        <div class="card-cover" style="background:${film.coverColor}"></div>
        <div class="card-body">
          <div class="card-year">${film.year}</div>
          <div class="card-title">${film.title}</div>
          <div class="card-company">${film.company} · Dir: ${film.director}</div>
          <div class="card-skaters">${film.skaters.join(', ')}</div>
          <div class="card-genres">${film.genre.map(g=>`<span class="genre-tag">${g}</span>`).join('')}</div>
          <div class="stars">${'★'.repeat(film.rating)}${'☆'.repeat(5-film.rating)} <span class="avg-user-badge">editorial</span></div>
          <div class="user-rating">
            <span class="user-rating-label">Your rating:</span>
            <span class="user-stars">${buildStarsHTML(film.id,'card')}</span>
          </div>
        </div>
      </div>`;
    });
    tl.appendChild(grid);
  });
}

function openModal(id){
  const f=films.find(x=>x.id===id);if(!f)return;
  const favActive=isFav(id)?'active':'';
  const m=document.getElementById('modal');
  m.innerHTML=`
    <div class="modal-cover" style="background:${f.coverColor}"></div>
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-body">
      <div style="display:flex;align-items:center;gap:.75rem">
        <h2 style="flex:1">${f.title}</h2>
        <button class="fav-btn ${favActive}" onclick="handleFavClick(event,'${id}')" title="Toggle favorite" style="font-size:1.5rem">❤️</button>
      </div>
      <div class="meta">${f.year} · ${f.company} · Dir: ${f.director}</div>
      <div class="stars">${'★'.repeat(f.rating)}${'☆'.repeat(5-f.rating)} <span class="avg-user-badge">editorial</span></div>
      <div class="user-rating" style="margin:.5rem 0">
        <span class="user-rating-label">Your rating:</span>
        <span class="user-stars">${buildStarsHTML(id,'modal')}</span>
      </div>
      <p class="desc">${f.description}</p>
      <div class="section-title">Featured Skaters</div>
      <div class="skater-list">${f.skaters.map(s=>`<a href="skaters.html#${s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}" class="skater-chip" style="text-decoration:none;color:inherit;cursor:pointer;transition:.2s;border:1px solid #333">${s}</a>`).join('')}</div>
      <div class="section-title">Genres</div>
      <div class="card-genres">${f.genre.map(g=>`<span class="genre-tag">${g}</span>`).join('')}</div>
      <div class="section-title">Watch</div>
      <div class="watch-links">${f.watchLinks.map(l=>`<a class="watch-btn" href="${l.url}" target="_blank">${l.platform} →</a>`).join('')}</div>
    </div>`;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open')}
document.getElementById('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('search').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',render);
init();
</script>
</body>
</html>
